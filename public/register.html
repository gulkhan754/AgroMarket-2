<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тіркелу — AgroMarket</title><link rel="stylesheet" href="style.css"><script src="auth.js" defer></script></head><body class="auth-page"><a class="auth-brand" href="/">❧ AgroMarket</a><main class="auth-shell"><div class="auth-art"><span class="eyebrow">БІЗГЕ ҚОСЫЛЫҢЫЗ</span><h1>Табиғи өнімдерге бір қадам.</h1><p>Жеке кабинет ашып, тапсырыстарыңызды қадағалаңыз.</p><div class="auth-art-emoji">🍊 🥕 🥛</div></div><div class="auth-card"><span class="eyebrow">ЖАҢА АККАУНТ</span><h2>Тіркелу</h2><p>Бір минутта аккаунт ашыңыз.</p><form id="register-form"><label>Аты-жөніңіз<input name="name" placeholder="Атыңыз" minlength="2" maxlength="80" required></label><label>Email<input type="email" name="email" placeholder="email@example.com" autocomplete="email" required></label><label>Құпиясөз<input type="password" name="password" minlength="8" maxlength="72" placeholder="Кемінде 8 таңба" autocomplete="new-password" required></label><label>Құпиясөзді қайталау<input type="password" name="confirm" minlength="8" placeholder="Қайталаңыз" autocomplete="new-password" required></label><p id="form-message" class="form-message" role="status"></p><button class="primary full" type="submit">Аккаунт ашу →</button></form><p class="auth-switch">Аккаунтыңыз бар ма? <a href="login.html">Кіру</a></p></div></main></body></html>
